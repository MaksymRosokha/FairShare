<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FairShare — Login</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/components/header.css}">
    <link rel="stylesheet" th:href="@{/css/components/footer.css}">
    <link rel="stylesheet" th:href="@{/css/authorization/authorization-page.css}">
    <link rel="stylesheet" th:href="@{/css/main-page.css}">
</head>
<body>

<div th:replace="~{components/header :: site-header}"></div>

<main class="landing-page" style="justify-content: center; min-height: calc(100vh - 130px);">
    <div class="container" style="margin: 0 auto;">
        <div class="logo-area">
            <h1>FairShare</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="alert-error" th:if="${isAuthenticationFailed}">
            <span th:text="${errorMessage}"></span>
        </div>

        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" required placeholder="Enter your login" minlength="3" maxlength="128">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••" minlength="8" maxlength="128">
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="form-footer">
            Don't have an account? <a th:href="@{/registration}">Sign Up</a>
        </div>
    </div>
</main>

<div th:replace="~{components/footer :: site-footer}"></div>

</body>
</html>

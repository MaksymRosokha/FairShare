<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<header class="header" th:fragment="site-header">
    <div class="header-container">
        <a th:href="@{/}" class="logo">FairShare 🚀</a>
        <div class="nav-links">
            <a th:if="${!isUserAuthenticated}" th:href="@{/login}" class="nav-btn-text">Sign In</a>
            <a th:if="${!isUserAuthenticated}" th:href="@{/registration}" class="btn-primary nav-btn-primary">Get Started</a>
            <a th:if="${isUserAuthenticated}" th:href="@{/logout}" class="nav-btn-text">Log Out</a>
        </div>
    </div>
</header>
</body>
</html>
